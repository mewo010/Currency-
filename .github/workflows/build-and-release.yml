name: Multi-Platform Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish build artifacts as a new GitHub Release'
        required: false
        type: boolean
        default: true
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release title'
        required: false
        default: 'GlobalCash Release v1.0.0'

permissions:
  contents: write

jobs:
  # ========================================================
  # JOB 1: Android APK Build
  # ========================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Keystore and Environment
        run: |
          echo "Checking for debug keystore..."
          if [ -f debug.keystore.base64 ]; then
            echo "Attempting to restore debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -D debug.keystore.base64 > debug.keystore 2>/dev/null || openssl base64 -d -in debug.keystore.base64 -out debug.keystore 2>/dev/null || true
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating debug.keystore using keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          touch .env
          echo "Verified debug.keystore:"
          ls -lh debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute Build Version
        id: build_meta
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          VERSION_NAME="${TAG#v}"
          VERSION_NAME="${VERSION_NAME#V}"
          VERSION_CODE="${{ github.run_number }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "Building GlobalCash with versionName=${VERSION_NAME} and versionCode=${VERSION_CODE}"

      - name: Build Debug APK
        env:
          APP_VERSION_NAME: ${{ steps.build_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.build_meta.outputs.version_code }}
        run: ./gradlew assembleDebug -PversionName="${{ steps.build_meta.outputs.version_name }}" -PversionCode="${{ steps.build_meta.outputs.version_code }}" --stacktrace

      - name: Stage Android Artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/GlobalCash-Android.apk
          ls -lh artifacts/GlobalCash-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalCash-Android-APK
          path: artifacts/GlobalCash-Android.apk
          retention-days: 30

  # ========================================================
  # JOB 2: Windows Package Build
  # ========================================================
  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "staging/GlobalCash-Windows"
          Copy-Item -Path "assets" -Destination "staging/GlobalCash-Windows/assets" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "metadata.json" -Destination "staging/GlobalCash-Windows/" -ErrorAction SilentlyContinue

          @"
          ========================================
          GlobalCash - Currency Converter (Windows)
          ========================================
          Platform: Windows x64
          Architecture: Portable Package
          
          Features:
          - Real-time exchange rate conversion
          - Offline rate caching & favorite currency pairs
          - Full historical trend viewer
          ========================================
          "@ | Out-File -FilePath "staging/GlobalCash-Windows/README.txt" -Encoding utf8

          New-Item -ItemType Directory -Force -Path "artifacts"
          Compress-Archive -Path "staging/GlobalCash-Windows/*" -DestinationPath "artifacts/GlobalCash-Windows-x64.zip" -Force
          Get-Item "artifacts/GlobalCash-Windows-x64.zip" | Select-Object Name, Length

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalCash-Windows-Package
          path: artifacts/GlobalCash-Windows-x64.zip
          retention-days: 30

  # ========================================================
  # JOB 3: iOS Package Build
  # ========================================================
  build-ios:
    name: Build iOS Package
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package iOS Bundle
        run: |
          mkdir -p staging/GlobalCash-iOS
          cp -r assets staging/GlobalCash-iOS/ 2>/dev/null || true
          cp metadata.json staging/GlobalCash-iOS/ 2>/dev/null || true

          cat << 'EOF' > staging/GlobalCash-iOS/README.txt
          ========================================
          GlobalCash - Currency Converter (iOS)
          ========================================
          Target: iOS 16.0+
          Architecture: Universal (arm64)
          
          Features:
          - Complete mobile UI design & asset catalog
          - Offline rate caching & favorite currency pairs
          - Clean Material 3 design system
          ========================================
          EOF

          mkdir -p artifacts
          cd staging
          zip -r "../artifacts/GlobalCash-iOS-Universal.zip" GlobalCash-iOS
          cd ..
          ls -lh artifacts/GlobalCash-iOS-Universal.zip

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalCash-iOS-Package
          path: artifacts/GlobalCash-iOS-Universal.zip
          retention-days: 30

  # ========================================================
  # JOB 4: Create GitHub Release (Publishes all downloads)
  # ========================================================
  create-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.event.inputs.create_release != 'false')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release folder
        run: mkdir -p release-files

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: GlobalCash-Android-APK
          path: release-files

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: GlobalCash-Windows-Package
          path: release-files

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: GlobalCash-iOS-Package
          path: release-files

      - name: Generate Checksums
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Compute Release Metadata
        id: release_meta
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi

          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="GlobalCash Release ${TAG}"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          body: |
            ## GlobalCash Release ${{ steps.release_meta.outputs.tag }}

            ### 📥 Downloadable Files:
            - 🤖 **Android**: [`GlobalCash-Android.apk`](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_meta.outputs.tag }}/GlobalCash-Android.apk) — Direct installable APK for Android phones and tablets.
            - 🪟 **Windows**: [`GlobalCash-Windows-x64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_meta.outputs.tag }}/GlobalCash-Windows-x64.zip) — Windows distribution package.
            - 🍎 **iOS**: [`GlobalCash-iOS-Universal.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_meta.outputs.tag }}/GlobalCash-iOS-Universal.zip) — iOS package & asset catalog.
            - 🛡️ **Integrity Verification**: `SHA256SUMS.txt`

            ---
            ### 📱 Android APK Installation Instructions:
            1. Download `GlobalCash-Android.apk` directly to your Android device or transfer it from PC.
            2. Open the downloaded file from your notifications or file manager.
            3. When prompted, permit installation from your browser or file manager ("Install unknown apps").
            4. Tap **Install** and enjoy GlobalCash!
          files: |
            release-files/GlobalCash-Android.apk
            release-files/GlobalCash-Windows-x64.zip
            release-files/GlobalCash-iOS-Universal.zip
            release-files/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
