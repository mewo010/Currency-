name: Build Windows Package

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish Windows package to a new GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release tag (if creating release)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare Windows Distribution Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/GlobalCash-Windows"
          Copy-Item -Path "assets" -Destination "dist/GlobalCash-Windows/assets" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "metadata.json" -Destination "dist/GlobalCash-Windows/" -ErrorAction SilentlyContinue

          # Generate Windows runner and readme information
          @"
          ========================================
          GlobalCash - Currency Converter (Windows)
          ========================================
          Version: 1.0.0
          Build Platform: Windows x64
          Architecture: Portable App Distribution Package
          
          Included Components:
          - Application Configuration & Assets
          - Currency Data Models & Exchange Rate Cache Engine
          - Android Companion Package Link
          ========================================
          "@ | Out-File -FilePath "dist/GlobalCash-Windows/README.txt" -Encoding utf8

          Compress-Archive -Path "dist/GlobalCash-Windows/*" -DestinationPath "dist/GlobalCash-Windows-x64.zip" -Force
          Get-Item "dist/GlobalCash-Windows-x64.zip" | Select-Object Name, Length

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalCash-Windows-Package
          path: dist/GlobalCash-Windows-x64.zip
          retention-days: 30

      - name: Create / Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.tag_name || github.ref_name }} - Windows Release
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/GlobalCash-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
