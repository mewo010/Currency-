name: Create Release (All Platforms)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'GlobalCash Release v1.0.0'
      is_prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore"
          fi
          touch .env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage Android Release Artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/GlobalCash-Android-v1.0.apk
          ls -lh artifacts/GlobalCash-Android-v1.0.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: artifacts/GlobalCash-Android-v1.0.apk

  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Windows Distribution Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "staging/GlobalCash-Windows"
          Copy-Item -Path "assets" -Destination "staging/GlobalCash-Windows/assets" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "metadata.json" -Destination "staging/GlobalCash-Windows/" -ErrorAction SilentlyContinue

          @"
          ========================================
          GlobalCash - Currency Converter (Windows)
          ========================================
          Version: 1.0.0
          Build Platform: Windows x64
          Type: Portable Distribution Package
          ========================================
          "@ | Out-File -FilePath "staging/GlobalCash-Windows/README.txt" -Encoding utf8

          New-Item -ItemType Directory -Force -Path "artifacts"
          Compress-Archive -Path "staging/GlobalCash-Windows/*" -DestinationPath "artifacts/GlobalCash-Windows-v1.0.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-pkg
          path: artifacts/GlobalCash-Windows-v1.0.zip

  build-ios:
    name: Build iOS Package
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare iOS Distribution Bundle
        run: |
          mkdir -p staging/GlobalCash-iOS
          cp -r assets staging/GlobalCash-iOS/ 2>/dev/null || true
          cp metadata.json staging/GlobalCash-iOS/ 2>/dev/null || true

          cat << 'EOF' > staging/GlobalCash-iOS/README.txt
          ========================================
          GlobalCash - Currency Converter (iOS)
          ========================================
          Version: 1.0.0
          Target OS: iOS 16.0+
          ========================================
          EOF

          mkdir -p artifacts
          cd staging
          zip -r "../artifacts/GlobalCash-iOS-v1.0.zip" GlobalCash-iOS

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-pkg
          path: artifacts/GlobalCash-iOS-v1.0.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release distribution directory
        run: mkdir -p release-dist

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-dist

      - name: Download Windows Package
        uses: actions/download-artifact@v4
        with:
          name: windows-release-pkg
          path: release-dist

      - name: Download iOS Package
        uses: actions/download-artifact@v4
        with:
          name: ios-release-pkg
          path: release-dist

      - name: Generate Checksums & Inspect Files
        run: |
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Determine Release Tag & Title
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi

          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="GlobalCash Release ${TAG}"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease == 'true' }}
          body: |
            ## GlobalCash Release ${{ steps.release_info.outputs.tag }}

            ### 📦 Download Assets:
            - **Android**: `GlobalCash-Android-v1.0.apk` (Direct installable APK for Android devices)
            - **Windows**: `GlobalCash-Windows-v1.0.zip` (Windows package & resources)
            - **iOS**: `GlobalCash-iOS-v1.0.zip` (iOS package & resources)
            - **Checksums**: `SHA256SUMS.txt`

            ---
            *Built automatically by GitHub Actions CI/CD pipeline.*
          files: |
            release-dist/GlobalCash-Android-v1.0.apk
            release-dist/GlobalCash-Windows-v1.0.zip
            release-dist/GlobalCash-iOS-v1.0.zip
            release-dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
